fer 任务：初始 stage = SubmitResponse，跳过 ① PollDataTransfer</tspan></text><line x1="510" y1="1360" x2="1840" y2="1360" stroke="#7048e8" stroke-width="2"/><ellipse cx="542.0" cy="1388.0" rx="14.0" ry="14.0" fill="#7048e8" stroke="#7048e8" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle"><tspan x="542.0" y="1393.2">2</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="20" fill="#7048e8" text-anchor="start"><tspan x="568.0" y="1395.5">SubmitResponse</tspan></text><line x1="1830" y1="1473" x2="610" y2="1473" stroke="#7048e8" stroke-width="2" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1220.0" y="1463.9">10. flagBufferPool_.Allocate()；ProtocolManager::PackResponse()</tspan></text><line x1="610" y1="1528" x2="1830" y2="1528" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1220.0" y="1518.9">打包结果 / flagBufferPool_ NoSpace</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#7048e8" text-anchor="end"><tspan x="1790.0" y="1553.5">NoSpace：stage 保持 SubmitResponse，记录留在 pending_，下一轮重试</tspan></text><line x1="1830" y1="1608" x2="1590" y2="1608" stroke="#7048e8" stroke-width="2" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1710.0" y="1598.9">11. ExecuteAsync(response Write → resp_addr)</tspan></text><line x1="1590" y1="1663" x2="1830" y2="1663" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1710.0" y="1653.9">返