ray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#6741d9" text-anchor="middle"><tspan x="925.0" y="490.9">同步/异步边界：RequestTask 已进入 requestQueue_</tspan></text><rect x="1741.1000671386719" y="164.3000373840332" width="180" height="58" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="1831.1" y="193.8">CompletionPoller</tspan><tspan x="1831.1" y="211.3">轮询线程</tspan></text><rect x="757.9999796549482" y="384.3333333333334" width="220" height="66" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan x="881.6" y="407.8">requestQueue_</tspan><tspan x="881.6" y="421.5">RequestQueue</tspan><tspan x="881.6" y="435.3">RequestReceiver → TaskWorker</tspan></text><line x1="360" y1="418" x2="751.9999796549482" y2="417.3498840876109" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><rect x="700" y="520" width="1080" height="530" rx="10" fill="none" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#7048e8" text-anchor="middle"><tspan x="1240.0" y="791.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#7048e8" text-anchor="start"><tspan x="718.0" y="550.4">TaskWorker：逐项固定 Entry 并提交数据 transfer 任务</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#7048e8" text-anchor="start"><tspan x="735.0" y="586.2">5. TryPop(requestQueue_)，进入 ProcessLoad()</tspan></text><rect x="770" y="625" width="860" height="270" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="1200.0" y="766.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#1971c2" text-anchor="start"><tspan x="788.0" y="655.4">for (entry : request.entries)</tspan></text><line x1="850" y1="708" x2="1340" y2="708" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1095.0" y="698.9">6. MetadataManager::LoadBegin(key)</tspan></text><line x1="1340" y1="768" x2="850" y2="768" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1095.0" y="758.9">7. READY Entry：refCnt++，返回 Host Buffer</tspan></text><rect x="1645" y="650" width="360" height="200" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#495057" text-anchor="middle"><tspan x="1825.0" y="732.0">逐项结果</tspan><tspan x="1825.0" y="747.0">不存在或非 READY：Failed</tspan><tspan x="1825.0" y="762.0">请求 len &gt; Entry::size：LoadEnd() 后 Failed</tspan><tspan x="1825.0" y="777.0">其余项：加入 TransferItem 和 Segment</tspan></text><line x1="850" y1="953" x2="1590" y2="953" stroke="#087f5b" stroke-width="2" marker-end="url(#arrow_087f5b)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#087f5b" text-anchor="middle"><tspan x="1220.0" y="943.9">8. ExecuteAsync(Write)：本地 Host → 远端 Device</tspan></text><line x1="1590" y1="1013" x2="850" y2="1013" stroke="#087f5b" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_087f5b)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#087f5b" text-anchor="middle"><tspan x="1220.0" y="1003.9">9. 返回 data_handle</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#c92a2a" text-anchor="start"><tspan x="740.0" y="1033.5">无 TransferItem 时直接响应；提交失败时先对已固定的 Entry 执行 LoadEnd()</tspan></text><rect x="720" y="1080" width="300" height="96" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1134.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="15" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1107.6">completionQueue_</tspan></text><rect x="760" y="1123" width="220" height="38" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1150.0">CompletionRecord · PollDataTransfer</tspan></text><line x1="850" y1="1052" x2="850" y2="1080" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="850.0" y="1051.2">Push</tspan></text><rect x="690" y="1210" width="1180" height="275" rx="10" fill="none" stroke="#e67700" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#e67700" text-anchor="middle"><tspan x="1280.0" y="1354.2"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#e67700" text-anchor="start"><tspan x="708.0" y="1240.4">CompletionPoller：等待传输并释放 Load 引用</tspan></text><line x1="1830" y1="1298" x2="1590" y2="1298" stroke="#e67700" stroke-width="2" marker-end="url(#arrow_e67700)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#e67700" text-anchor="middle"><tspan x="1710.0" y="1288.9">10. GetStatus(data_handle)</tspan></text><rect x="760" y="1335" width="1030" height="95" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#2b8a3e" text-anchor="middle"><tspan x="1275.0" y="1379.2">数据传输到达任一终态后，对每个 TransferItem 执行 MetadataManager::LoadEnd(key)；</tspan><tspan x="1275.0" y="1395.5">只有传输 Completed 且 LoadEnd() 成功时，该项结果才保持 Ok</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="15" fill="#7048e8" text-anchor="end"><tspan x="1790.0" y="1464.6">11. stage = SubmitResponse</tspan></text><rect x="690" y="1500" width="1180" height="520" rx="10" fill="none" stroke="#e67700" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#e67700" text-anchor="middle"><tspan x="1280.0" y="1766.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#e67700" text-anchor="start"><tspan x="708.0" y="1530.4">CompletionPoller：响应提交与回收</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#e67700" text-anchor="start"><tspan x="735.0" y="1575.5">12. FillPendingWindow()</tspan><tspan x="735.0" y="1593.0">completionQueue_ → pending_</tspan></text><rect x="1040" y="1552" width="290" height="74" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#e67700" text-anchor="middle"><tspan x="1185.0" y="1585.8">pending_</tspan><tspan x="1185.0" y="1602.0">CompletionRecord</tspan></text><line x1="1020" y1="1589" x2="1040" y2="1589" stroke="#e67700" stroke-width="2" marker-end="url(#arrow_e67700)"/><rect x="760" y="1665" width="315" height="110" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="917.5" y="1708.6">SubmitResponse</tspan><tspan x="917.5" y="1724.9">flagBufferPool_.Allocate()</tspan><tspan x="917.5" y="1741.1">ProtocolManager::PackResponse()</tspan></text><rect x="1160" y="1665" width="315" height="110" rx="10" fill="#e6fcf5" stroke="#087f5b" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#087f5b" text-anchor="middle"><tspan x="1317.5" y="1716.8">TransportManager::ExecuteAsync()</tspan><tspan x="1317.5" y="1733.0">response Write → resp_addr</tspan></text><rect x="1560" y="1665" width="260" height="110" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#e67700" text-anchor="middle"><tspan x="1690.0" y="1716.5">stage =</tspan><tspan x="1690.0" y="1734.0">PollResponseTransfer</tspan></text><line x1="1075" y1="1720" x2="1160" y2="1720" stroke="#7048e8" stroke-width="2" marker-end="url(#arrow_7048e8)"/><line x1="1475" y1="1720" x2="1560" y2="1720" stroke="#087f5b" stroke-width="2" marker-end="url(#arrow_087f5b)"/><rect x="870" y="1830" width="810" height="98" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#495057" text-anchor="middle"><tspan x="1275.0" y="1875.8">GetStatus(response_handle)</tspan><tspan x="1275.0" y="1892.0">Waiting：保留 local_resp_slot；终态或查询失败：ReleaseResponseBuffer()，从 pending_ 移除</tspan></text><line x1="1690" y1="1775" x2="1690" y2="1830" stroke="#e67700" stroke-width="2" marker-end="url(#arrow_e67700)"/><rect x="735" y="1945" width="1080" height="48" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#f08c00" text-anchor="middle"><tspan x="1275.0" y="1973.5">flagBufferPool_ NoSpace 时不改变 stage，记录留在 pending_，下一轮继续尝试</tspan></text></svg>