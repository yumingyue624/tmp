d" stroke-width="2" stroke-dasharray="9 7"/><rect x="1235" y="165" width="210" height="58" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1340.0" y="193.2">MetadataManager</tspan><tspan x="1340.0" y="209.5">ShardMetadata + Entry</tspan></text><rect x="1500" y="165" width="180" height="58" rx="10" fill="none" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="15" fill="#1971c2" text-anchor="middle"><tspan x="1590.0" y="201.6">TransportManager</tspan></text><rect x="245" y="245.66665649414062" width="650" height="195.13333129882812" rx="10" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#2f9e44" text-anchor="start"><tspan x="260.0" y="267.2">同步阶段：接收请求并构造 RequestTask</tspan></text><line x1="120" y1="300" x2="360" y2="300" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="240.0" y="294.5">1. 发送 DUMP Request</tspan></text><line x1="360" y1="342" x2="610" y2="342" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="485.0" y="332.5">2. ProtocolManager::UnpackRequest()</tspan></text><line x1="610" y1="382" x2="360" y2="382" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_2f9e44)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="485.0" y="369.5">3. 返回 RequestPtr</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#2f9e44" text-anchor="middle"><tspan x="545.0" y="423.9">4. TryPush(requestQueue_)</tspan></text><line x1="75" y1="498" x2="2221.491370260368" y2="498" stroke="#6741d9" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#6741d9" text-anchor="middle"><tspan x="950.0" y="490.9">同步/异步边界：RequestTask 已进入 requestQueue_</tspan></text><rect x="1741.1000671386719" y="164.3000373840332" width="180" height="58" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="1831.1" y="193.8">CompletionPoller</tspan><tspan x="1831.1" y="211.3">轮询线程</tspan></text><rect x="757.9999796549482" y="384.3333333333334" width="220" height="66" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan x="867.0" y="407.4">requestQueue_</tspan><tspan x="867.0" y="421.1">RequestQueue</tspan><tspan x="867.0" y="434.9">RequestReceiver → TaskWorker</tspan></text><line x1="360" y1="418" x2="751.9999796549482" y2="417.3498840876109" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><rect x="700" y="520" width="1080" height="565" rx="10" fill="none" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#7048e8" text-anchor="middle"><tspan x="1240.0" y="809.2"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#7048e8" text-anchor="start"><tspan x="718.0" y="550.4">TaskWorker：逐项建元数据并提交数据 transfer 任务</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#7048e8" text-anchor="start"><tspan x="735.0" y="586.2">5. TryPop(requestQueue_)，进入 ProcessDump()</tspan></text><rect x="770" y="625" width="860" height="300" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="1200.0" y="781.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#1971c2" text-anchor="start"><tspan x="788.0" y="655.4">for (entry : request.entries)</tspan></text><line x1="850" y1="708" x2="1340" y2="708" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1095.0" y="698.9">6. 构造 Entry，MetadataManager::StoreBegin(key, entry)</tspan></text><line x1="1340" y1="763" x2="1090" y2="763" stroke="#2b8a3e" stroke-width="2" marker-end="url(#arrow_2b8a3e)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#2b8a3e" text-anchor="middle"><tspan x="1215.0" y="753.9">7. BufferManager::Allocate(len)</tspan></text><line x1="1090" y1="818" x2="1340" y2="818" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_2b8a3e)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#2b8a3e" text-anchor="middle"><tspan x="1215.0" y="808.9">8. 返回 Host Buffer；插入 INITIALIZED Entry</tspan></text><line x1="1340" y1="873" x2="850" y2="873" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1095.0" y="863.9">9. Success / DuplicateKey / Failed</tspan></text><rect x="1645" y="650" width="360" height="210" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#495057" text-anchor="middle"><tspan x="1825.0" y="737.0">逐项结果</tspan><tspan x="1825.0" y="752.0">Success：加入 TransferItem 和 Segment</tspan><tspan x="1825.0" y="767.0">DuplicateKey：result = Ok，不传输</tspan><tspan x="1825.0" y="782.0">Failed：当前及后续项标为 Failed</tspan></text><line x1="850" y1="983" x2="1590" y2="983" stroke="#087f5b" stroke-width="2" marker-end="url(#arrow_087f5b)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#087f5b" text-anchor="middle"><tspan x="1220.0" y="973.9">10. ExecuteAsync(Read)：远端 Device → 本地 Host</tspan></text><line x1="1590" y1="1043" x2="850" y2="1043" stroke="#087f5b" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_087f5b)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#087f5b" text-anchor="middle"><tspan x="1220.0" y="1033.9">11. 返回 data_handle</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#c92a2a" text-anchor="start"><tspan x="740.0" y="1059.5">无 TransferItem 或提交失败时直接进入 SubmitResponse；提交失败会先删除本次新建的元数据</tspan></text><rect x="720" y="1115" width="300" height="96" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1169.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="15" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1142.6">completionQueue_</tspan></text><rect x="760" y="1158" width="220" height="38" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1185.0">CompletionRecord · PollDataTransfer</tspan></text><line x1="850" y1="1087" x2="850" y2="1115" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="850.0" y="1086.2">Push</tspan></text><rect x="690" y="1240" width="1180" height="870" rx="10" fill="none" stroke="#e67700" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#e67700" text-anchor="middle"><tspan x="1280.0" y="1681.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#e67700" text-anchor="start"><tspan x="708.0" y="1270.4">CompletionPoller</tspan></text><rect x="760" y="1290" width="340" height="92" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#e67700" text-anchor="middle"><tspan x="930.0" y="1332.5">12. FillPendingWindow()</tspan><tspan x="930.0" y="1350.0">TryPop(completionQueue_)</tspan></text><rect x="1210" y="1290" width="430" height="92" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#495057" text-anchor="middle"><tspan x="1425.0" y="1332.8">pending_ · deque&lt;CompletionRecord&gt;</tspan><tspan x="1425.0" y="1349.0">最大 g_config.pollerPendingDepth 条记录</tspan></text><line x1="870" y1="1211" x2="870" y2="1290" stroke="#e67700" stroke-width="2" marker-end="url(#arrow_e67700)"/><line x1="1100" y1="1336" x2="1210" y2="1336" stroke="#e67700" stroke-width="2" marker-end="url(#arrow_e67700)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#e67700" text-anchor="middle"><tspan x="1155.0" y="1321.2">emplace_back</tspan></text><line x1="720" y1="1435" x2="1840" y2="1435" stroke="#e67700" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#1971c2" text-anchor="start"><tspan x="740.0" y="1468.4">数据传输收尾 · PollDataTransfer</tspan></text><line x1="1830" y1="1523" x2="1590" y2="1523" stroke="#e67700" stroke-width="2" marker-end="url(#arrow_e67700)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#e67700" text-anchor="middle"><tspan x="1710.0" y="1513.9">13. GetStatus(data_handle)</tspan></text><rect x="760" y="1560" width="400" height="105" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#f08c00" text-anchor="middle"><tspan x="960.0" y="1601.1">Waiting</tspan><tspan x="960.0" y="1617.4">记录保留在 pending_</tspan><tspan x="960.0" y="1633.6">超时只记录诊断日志，继续轮询</tspan></text><rect x="1230" y="1560" width="560" height="105" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#2b8a3e" text-anchor="middle"><tspan x="1510.0" y="1601.1">14. SettleDataTransfer()</tspan><tspan x="1510.0" y="1617.4">Completed：StoreEnd() 发布 Entry</tspan><tspan x="1510.0" y="1633.6">Failed：Delete() 回收元数据和 Buffer</tspan></text><line x1="1590" y1="1540" x2="1510" y2="1560" stroke="#2b8a3e" stroke-width="2" marker-end="url(#arrow_2b8a3e)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="15" fill="#7048e8" text-anchor="end"><tspan x="1790.0" y="1689.6">stage = SubmitResponse</tspan></text><line x1="720" y1="1720" x2="1840" y2="1720" stroke="#e67700" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#7048e8" text-anchor="start"><tspan x="740.0" y="1753.4">响应提交与回收 · SubmitResponse → PollResponseTransfer</tspan></text><rect x="735" y="1785" width="315" height="112" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="892.5" y="1829.6">15. SubmitResponse</tspan><tspan x="892.5" y="1845.9">flagBufferPool_.Allocate()</tspan><tspan x="892.5" y="1862.1">ProtocolManager::PackResponse()</tspan></text><rect x="1130" y="1785" width="315" height="112" rx="10" fill="#e6fcf5" stroke="#087f5b" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#087f5b" text-anchor="middle"><tspan x="1287.5" y="1837.8">16. TransportManager::ExecuteAsync()</tspan><tspan x="1287.5" y="1854.0">response Write → resp_addr</tspan></text><rect x="1530" y="1785" width="275" height="112" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#e67700" text-anchor="middle"><tspan x="1667.5" y="1837.5">stage =</tspan><tspan x="1667.5" y="1855.0">PollResponseTransfer</tspan></text><line x1="1050" y1="1841" x2="1130" y2="1841" stroke="#7048e8" stroke-width="2" marker-end="url(#arrow_7048e8)"/><line x1="1445" y1="1841" x2="1530" y2="1841" stroke="#087f5b" stroke-width="2" marker-end="url(#arrow_087f5b)"/><rect x="840" y="1940" width="820" height="92" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#495057" text-anchor="middle"><tspan x="1250.0" y="1982.8">17. GetStatus(response_handle)</tspan><tspan x="1250.0" y="1999.0">Waiting：保留 local_resp_slot；终态或查询失败：释放 Slot，并从 pending_ 移除</tspan></text><line x1="1667" y1="1897" x2="1667" y2="1940" stroke="#e67700" stroke-width="2" marker-end="url(#arrow_e67700)"/><rect x="735" y="2045" width="1080" height="48" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#f08c00" text-anchor="middle"><tspan x="1275.0" y="2073.5">flagBufferPool_ NoSpace：stage 保持 SubmitResponse，记录留在 pending_，下一轮重试</tspan></text></svg>