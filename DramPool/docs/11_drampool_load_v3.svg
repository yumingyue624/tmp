#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1340.0" y="193.2">MetadataManager</tspan><tspan x="1340.0" y="209.5">ShardMetadata + Entry</tspan></text><rect x="1500" y="165" width="180" height="58" rx="10" fill="none" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="15" fill="#1971c2" text-anchor="middle"><tspan x="1590.0" y="201.6">TransportManager</tspan></text><rect x="245" y="245.66665649414062" width="650" height="195.13333129882812" rx="10" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#2f9e44" text-anchor="start"><tspan x="260.0" y="276.2">同步阶段：接收请求并构造 RequestTask</tspan></text><line x1="120" y1="300" x2="360" y2="300" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="240.0" y="302.2">1. 发送 LOAD Request</tspan></text><line x1="360" y1="342" x2="610" y2="342" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="485.0" y="337.2">2. ProtocolManager::UnpackRequest()</tspan></text><line x1="610" y1="382" x2="360" y2="382" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_2f9e44)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="485.0" y="369.5">3. 返回 RequestPtr</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#2f9e44" text-anchor="middle"><tspan x="545.0" y="415.2">4. TryPush(requestQueue_)</tspan></text><line x1="75" y1="498" x2="2221.491370260368" y2="498" stroke="#6741d9" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#6741d9" text-anchor="middle"><tspan x="925.0" y="490.9">同步/异步边界：RequestTask 已进入 requestQueue_</tspan></text><rect x="1741.1000671386719" y="164.3000373840332" width="180" height="58" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="1831.1" y="193.8">CompletionPoller</tspan><tspan x="1831.1" y="211.3">轮询线程</tspan></text><rect x="757.9999796549482" y="384.3333333333334" width="220" height="66" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan x="881.6" y="407.8">requestQueue_</tspan><tspan x="881.6" y="421.5">RequestQueue</tspan><tspan x="881.6" y="435.3">RequestReceiver → TaskWorker</tspan></text><line x1="360" y1="418" x2="751.9999796549482" y2="417.3498840876109" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><rect x="700" y="520" width="1080" height="530" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="1240.0" y="791.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#1971c2" text-anchor="start"><tspan x="718.0" y="550.4">TaskWorker：逐项固定 Entry 并提交数据 transfer 任务</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="735.0" y="586.2">5. TryPop(requestQueue_)，进入 ProcessLoad()</tspan></text><rect x="770" y="625" width="860" height="270" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="1200.0" y="766.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#1971c2" text-anchor="start"><tspan x="788.0" y="655.4">for (entry : request.entries)</tspan></text><line x1="850" y1="708" x2="1340" y2="708" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1095.0" y="698.9">6. MetadataManager::LoadBegin(key)</tspan></text><line x1="1340" y1="768" x2="850" y2="768" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1095.0" y="758.9">7. READY Entry：refCnt++，返回 Host Buffer</tspan></text><rect x="1645" y="650" width="360" height="200" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle"><tspan x="1825.0" y="732.0">逐项结果</tspan><tspan x="1825.0" y="747.0">不存在或非 READY：Failed</tspan><tspan x="1825.0" y="762.0">请求 len &gt; Entry::size：LoadEnd() 后 Failed</tspan><tspan x="1825.0" y="777.0">其余项：加入 TransferItem 和 Segment</tspan></text><line x1="850" y1="953" x2="1590" y2="953" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1220.0" y="943.9">8. ExecuteAsync(Write)：本地 Host → 远端 Device</tspan></text><line x1="1590" y1="1013" x2="850" y2="1013" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1220.0" y="1003.9">9. 返回 data_handle</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="start"><tspan x="740.0" y="1033.5">无 TransferItem 时直接响应；提交失败时先对已固定的 Entry 执行 LoadEnd()</tspan></text><rect x="720" y="1080" width="300" height="96" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1134.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="15" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1107.6">completionQueue_</tspan></text><rect x="760" y="1123" width="220" height="38" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1150.0">CompletionRecord · PollDataTransfer</tspan></text><line x1="850" y1="1052" x2="850" y2="1080" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="850.0" y="1051.2">Push</tspan></text><rect x="480" y="1210" width="1390" height="1120" rx="10" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#495057" text-anchor="middle"><tspan x="1175.0" y="1776.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#495057" text-anchor="start"><tspan x="498.0" y="1240.4">CompletionPoller</tspan></text><rect x="1490" y="1250" width="340" height="78" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#495057" text-anchor="middle"><tspan x="1660.0" y="1285.5">pending_</tspan><tspan x="1660.0" y="1303.0">deque&lt;CompletionRecord&gt;</tspan></text><line x1="1830" y1="1373" x2="850" y2="1373" stroke="#495057" stroke-width="2" marker-end="url(#arrow_495057)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#495057" text-anchor="middle"><tspan x="1340.0" y="1363.9">10. FillPendingWindow()：completionQueue_.TryPop()</tspan></text><line x1="850" y1="1428" x2="1830" y2="1428" stroke="#495057" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_495057)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#495057" text-anchor="middle"><tspan x="1340.0" y="1418.9">record → pending_.emplace_back()</tspan></text><line x1="510" y1="1460" x2="1840" y2="1460" stroke="#1971c2" stroke-width="2"/><ellipse cx="555.0" cy="1500.0" rx="27.0" ry="27.0" fill="#1971c2" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="25" fill="#ffffff" text-anchor="middle"><tspan x="555.0" y="1509.4">1</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" fill="#1971c2" text-anchor="start"><tspan x="600.0" y="1508.6">PollDataTransfer</tspan></text><line x1="1830" y1="1573" x2="1590" y2="1573" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1710.0" y="1563.9">11. GetStatus(data_handle)</tspan></text><line x1="1590" y1="1628" x2="1830" y2="1628" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1710.0" y="1618.9">Waiting / Completed / Failed</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="start"><tspan x="525.0" y="1660.5">Waiting：记录保留在 pending_；超时只记录诊断日志，下一轮继续轮询</tspan></text><line x1="1830" y1="1718" x2="1340" y2="1718" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1585.0" y="1708.9">12. SettleDataTransfer()：每个 TransferItem 执行 LoadEnd(key)</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="end"><tspan x="1790.0" y="1751.9">仅 Completed 且 LoadEnd() 成功时结果为 Ok；stage = SubmitResponse</tspan></text><line x1="510" y1="1780" x2="1840" y2="1780" stroke="#7048e8" stroke-width="2"/><ellipse cx="555.0" cy="1820.0" rx="27.0" ry="27.0" fill="#7048e8" stroke="#7048e8" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="25" fill="#ffffff" text-anchor="middle"><tspan x="555.0" y="1829.4">2</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" fill="#7048e8" text-anchor="start"><tspan x="600.0" y="1828.6">SubmitResponse</tspan></text><line x1="1830" y1="1893" x2="610" y2="1893" stroke="#7048e8" stroke-width="2" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1220.0" y="1883.9">13. flagBufferPool_.Allocate()；ProtocolManager::PackResponse()</tspan></text><line x1="610" y1="1948" x2="1830" y2="1948" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1220.0" y="1938.9">打包结果 / flagBufferPool_ NoSpace</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#7048e8" text-anchor="end"><tspan x="1790.0" y="1973.5">NoSpace：stage 保持 SubmitResponse，记录留在 pending_，下一轮重试</tspan></text><line x1="1830" y1="2028" x2="1590" y2="2028" stroke="#7048e8" stroke-width="2" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1710.0" y="2018.9">14. ExecuteAsync(response Write → resp_addr)</tspan></text><line x1="1590" y1="2083" x2="1830" y2="2083" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1710.0" y="2073.9">返回 response_handle</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#e67700" text-anchor="end"><tspan x="1790.0" y="2111.2">stage = PollResponseTransfer</tspan></text><line x1="510" y1="2130" x2="1840" y2="2130" stroke="#e67700" stroke-width="2"/><ellipse cx="555.0" cy="2170.0" rx="27.0" ry="27.0" fill="#e67700" stroke="#e67700" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="25" fill="#ffffff" text-anchor="middle"><tspan x="555.0" y="2179.4">3</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23" fill="#e67700" text-anchor="start"><tspan x="600.0" y="2178.6">PollResponseTransfer</tspan></text><line x1="1830" y1="2243" x2="1590" y2="2243" stroke="#e67700" stroke-width="2" marker-end="url(#arrow_e67700)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#e67700" text-anchor="middle"><tspan x="1710.0" y="2233.9">15. GetStatus(response_handle)</tspan></text><line x1="1590" y1="2298" x2="1830" y2="2298" stroke="#e67700" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_e67700)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#e67700" text-anchor="middle"><tspan x="1710.0" y="2288.5">Waiting：保留 Slot / 终态或查询失败：释放 Slot 并移除记录</tspan></text></svg>