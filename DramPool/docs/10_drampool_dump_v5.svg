solas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1340.0" y="193.2">MetadataManager</tspan><tspan x="1340.0" y="209.5">ShardMetadata + Entry</tspan></text><rect x="1500" y="165" width="180" height="58" rx="10" fill="none" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="15" fill="#1971c2" text-anchor="middle"><tspan x="1590.0" y="201.6">TransportManager</tspan></text><rect x="245" y="245.66665649414062" width="650" height="195.13333129882812" rx="10" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#2f9e44" text-anchor="start"><tspan x="260.0" y="267.2">同步阶段：接收请求并构造 RequestTask</tspan></text><line x1="120" y1="300" x2="360" y2="300" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="240.0" y="294.5">1. 发送 DUMP Request</tspan></text><line x1="360" y1="342" x2="610" y2="342" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="485.0" y="332.5">2. ProtocolManager::UnpackRequest()</tspan></text><line x1="610" y1="382" x2="360" y2="382" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_2f9e44)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="485.0" y="369.5">3. 返回 RequestPtr</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#2f9e44" text-anchor="middle"><tspan x="545.0" y="423.9">4. TryPush(requestQueue_)</tspan></text><line x1="75" y1="498" x2="2221.491370260368" y2="498" stroke="#6741d9" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#6741d9" text-anchor="middle"><tspan x="950.0" y="490.9">同步/异步边界：RequestTask 已进入 requestQueue_</tspan></text><rect x="1741.1000671386719" y="164.3000373840332" width="180" height="58" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="1831.1" y="193.8">CompletionPoller</tspan><tspan x="1831.1" y="211.3">轮询线程</tspan></text><rect x="757.9999796549482" y="384.3333333333334" width="220" height="66" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="11" fill="#343a40" text-anchor="middle"><tspan x="867.0" y="407.4">requestQueue_</tspan><tspan x="867.0" y="421.1">RequestQueue</tspan><tspan x="867.0" y="434.9">RequestReceiver → TaskWorker</tspan></text><line x1="360" y1="418" x2="751.9999796549482" y2="417.3498840876109" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow_2f9e44)"/><rect x="700" y="520" width="1080" height="565" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="1240.0" y="809.2"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#1971c2" text-anchor="start"><tspan x="718.0" y="550.4">TaskWorker：逐项建元数据并提交数据 transfer 任务</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="735.0" y="586.2">5. TryPop(requestQueue_)，进入 ProcessDump()</tspan></text><rect x="770" y="625" width="860" height="300" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="1200.0" y="781.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#1971c2" text-anchor="start"><tspan x="788.0" y="655.4">for (entry : request.entries)</tspan></text><line x1="850" y1="708" x2="1340" y2="708" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1095.0" y="698.9">6. 构造 Entry，MetadataManager::StoreBegin(key, entry)</tspan></text><line x1="1340" y1="763" x2="1090" y2="763" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1215.0" y="753.9">7. BufferManager::Allocate(len)</tspan></text><line x1="1090" y1="818" x2="1340" y2="818" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1215.0" y="808.9">8. 返回 Host Buffer；插入 INITIALIZED Entry</tspan></text><line x1="1340" y1="873" x2="850" y2="873" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1095.0" y="863.9">9. Success / DuplicateKey / Failed</tspan></text><rect x="1645" y="650" width="360" height="210" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle"><tspan x="1825.0" y="737.0">逐项结果</tspan><tspan x="1825.0" y="752.0">Success：加入 TransferItem 和 Segment</tspan><tspan x="1825.0" y="767.0">DuplicateKey：result = Ok，不传输</tspan><tspan x="1825.0" y="782.0">Failed：当前及后续项标为 Failed</tspan></text><line x1="850" y1="983" x2="1590" y2="983" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1220.0" y="973.9">10. ExecuteAsync(Read)：远端 Device → 本地 Host</tspan></text><line x1="1590" y1="1043" x2="850" y2="1043" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1220.0" y="1033.9">11. 返回 data_handle</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="start"><tspan x="740.0" y="1059.5">无 TransferItem 或提交失败时直接进入 SubmitResponse；提交失败会先删除本次新建的元数据</tspan></text><rect x="720" y="1115" width="300" height="96" rx="10" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1169.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="15" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1142.6">completionQueue_</tspan></text><rect x="760" y="1158" width="220" height="38" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="middle"><tspan x="870.0" y="1185.0">CompletionRecord · PollDataTransfer</tspan></text><line x1="850" y1="1087" x2="850" y2="1115" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="850.0" y="1086.2">Push</tspan></text><rect x="480" y="1240" width="1390" height="1080" rx="10" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="9 7"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="18" fill="#495057" text-anchor="middle"><tspan x="1175.0" y="1786.8"></tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="17" fill="#495057" text-anchor="start"><tspan x="498.0" y="1270.4">CompletionPoller</tspan></text><rect x="1490" y="1280" width="340" height="78" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#495057" text-anchor="middle"><tspan x="1660.0" y="1315.5">pending_</tspan><tspan x="1660.0" y="1333.0">deque&lt;CompletionRecord&gt;</tspan></text><line x1="1830" y1="1403" x2="850" y2="1403" stroke="#495057" stroke-width="2" marker-end="url(#arrow_495057)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#495057" text-anchor="middle"><tspan x="1340.0" y="1393.9">12. FillPendingWindow()：completionQueue_.TryPop()</tspan></text><line x1="850" y1="1458" x2="1830" y2="1458" stroke="#495057" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_495057)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#495057" text-anchor="middle"><tspan x="1340.0" y="1448.9">record → pending_.emplace_back()</tspan></text><line x1="510" y1="1495" x2="1840" y2="1495" stroke="#1971c2" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#1971c2" text-anchor="start"><tspan x="530.0" y="1532.5">①  PollDataTransfer</tspan></text><line x1="1830" y1="1598" x2="1590" y2="1598" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1710.0" y="1588.9">13. GetStatus(data_handle)</tspan></text><line x1="1590" y1="1653" x2="1830" y2="1653" stroke="#1971c2" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1710.0" y="1643.9">Waiting / Completed / Failed</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#1971c2" text-anchor="start"><tspan x="525.0" y="1685.5">Waiting：记录保留在 pending_；超时只记录诊断日志，下一轮继续轮询</tspan></text><line x1="1830" y1="1738" x2="1340" y2="1738" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow_1971c2)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#1971c2" text-anchor="middle"><tspan x="1585.0" y="1728.9">14. SettleDataTransfer()：StoreEnd() / Delete()</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#7048e8" text-anchor="end"><tspan x="1790.0" y="1772.2">完成元数据收尾，stage = SubmitResponse</tspan></text><line x1="510" y1="1800" x2="1840" y2="1800" stroke="#7048e8" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#7048e8" text-anchor="start"><tspan x="530.0" y="1837.5">②  SubmitResponse</tspan></text><line x1="1830" y1="1903" x2="610" y2="1903" stroke="#7048e8" stroke-width="2" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1220.0" y="1893.9">15. flagBufferPool_.Allocate()；ProtocolManager::PackResponse()</tspan></text><line x1="610" y1="1958" x2="1830" y2="1958" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1220.0" y="1948.9">打包结果 / flagBufferPool_ NoSpace</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#7048e8" text-anchor="end"><tspan x="1790.0" y="1983.5">NoSpace：stage 保持 SubmitResponse，记录留在 pending_，下一轮重试</tspan></text><line x1="1830" y1="2038" x2="1590" y2="2038" stroke="#7048e8" stroke-width="2" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1710.0" y="2028.9">16. ExecuteAsync(response Write → resp_addr)</tspan></text><line x1="1590" y1="2093" x2="1830" y2="2093" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_7048e8)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#7048e8" text-anchor="middle"><tspan x="1710.0" y="2083.9">返回 response_handle</tspan></text><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="14" fill="#e67700" text-anchor="end"><tspan x="1790.0" y="2121.2">stage = PollResponseTransfer</tspan></text><line x1="510" y1="2140" x2="1840" y2="2140" stroke="#e67700" stroke-width="2"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#e67700" text-anchor="start"><tspan x="530.0" y="2177.5">③  PollResponseTransfer</tspan></text><line x1="1830" y1="2238" x2="1590" y2="2238" stroke="#e67700" stroke-width="2" marker-end="url(#arrow_e67700)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="13" fill="#e67700" text-anchor="middle"><tspan x="1710.0" y="2228.9">17. GetStatus(response_handle)</tspan></text><line x1="1590" y1="2293" x2="1830" y2="2293" stroke="#e67700" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow_e67700)"/><text font-family="Consolas, Microsoft YaHei, sans-serif" font-size="12" fill="#e67700" text-anchor="middle"><tspan x="1710.0" y="2283.5">Waiting：保留 Slot / 终态或查询失败：释放 Slot 并移除记录</tspan></text></svg>