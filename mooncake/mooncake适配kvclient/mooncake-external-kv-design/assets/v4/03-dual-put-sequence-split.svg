<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="2410" viewBox="0 0 2040 2410">
<rect width="100%" height="100%" fill="white"/>
<text x="50" y="56.0" font-family="Microsoft YaHei, sans-serif" font-size="30" text-anchor="start" fill="#243746">双写时序：外部提交失败与执行失败分别处理</text>
