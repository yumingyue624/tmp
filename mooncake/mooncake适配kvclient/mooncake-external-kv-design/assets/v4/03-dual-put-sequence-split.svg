<text x="1050" y="878.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#28705f">以 TaskId 构造 OperationHandle</text>
<text x="1050" y="901.4" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#28705f">保存 SDK 上下文与批量下标</text>
