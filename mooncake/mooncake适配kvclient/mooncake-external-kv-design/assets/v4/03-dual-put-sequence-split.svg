<text x="1010.0" y="2225.9" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#657583">返回前，两路必须停止访问源 buffer；Wait 超时不等于底层传输停止。</text>
<text x="1010.0" y="2254.5" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#657583">原生失败但外部成功：保留外部对象；批量结果按原始 key 下标还原。</text>
