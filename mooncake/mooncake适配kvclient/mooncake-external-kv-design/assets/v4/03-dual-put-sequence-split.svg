<text x="650" y="1218.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#ad3434">记录外部失败</text>
<text x="650" y="1241.4" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#ad3434">继续原生写入</text>
