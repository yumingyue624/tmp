<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930">
<rect width="100%" height="100%" fill="white"/>
<text x="50" y="56.0" font-family="Microsoft YaHei, sans-serif" font-size="30" text-anchor="start" fill="#243746">04  删除流程与失败分支</text>
<text x="50" y="100.0" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="start" fill="#657583">先判断原生删除结果，再决定是否执行外部 Remove；每个 key 独立汇合。</text>
<rect x="500" y="165" width="360" height="105" fill="#edf3fa" stroke="#315b8a" stroke-width="2"/>
<text x="680.0" y="210.6" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#315b8a">同 key 前序操作收敛</text>
<text x="680.0" y="240.5" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#315b8a">执行原生 Remove</text>
<polyline points="680,270 680,320 260,320 260,455" fill="none" stroke="#28705f" stroke-width="2"/>
<polyline points="254.99755037084947,444.09241100390136 260,455 265.00244962915053,444.09241100390136" fill="none" stroke="#28705f" stroke-width="2"/>
<polyline points="680,270 680,455" fill="none" stroke="#93651f" stroke-width="2"/>
<polyline points="674.9975503708495,444.09241100390136 680,455 685.0024496291505,444.09241100390136" fill="none" stroke="#93651f" stroke-width="2"/>
<polyline points="680,270 680,320 1100,320 1100,455" fill="none" stroke="#657583" stroke-width="2"/>
<polyline points="1094.9975503708495,444.09241100390136 1100,455 1105.0024496291505,444.09241100390136" fill="none" stroke="#657583" stroke-width="2"/>
<text x="160.0" y="385.0" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#28705f">成功 /</text>
<text x="160.0" y="411.0" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#28705f">明确 NotFound</text>
<text x="800.0" y="385.0" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#93651f">租约 / 权限等</text>
<text x="800.0" y="411.0" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#93651f">明确拒绝</text>
<text x="1240.0" y="385.0" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#657583">Timeout /</text>
<text x="1240.0" y="411.0" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle" fill="#657583">结果不确定</text>
<rect x="80" y="455" width="360" height="115" fill="#edf7f2" stroke="#28705f" stroke-width="2"/>
<text x="260.0" y="505.6" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#28705f">执行外部 Remove</text>
<text x="260.0" y="535.5" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#28705f">Wait 并汇合</text>
<rect x="500" y="455" width="360" height="115" fill="#fff6e7" stroke="#93651f" stroke-width="2"/>
<text x="680.0" y="505.6" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#93651f">不删除外部</text>
<text x="680.0" y="535.5" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#93651f">返回原生错误</text>
<rect x="920" y="455" width="360" height="115" fill="#f5f7f9" stroke="#657583" stroke-width="2"/>
<text x="1100.0" y="505.6" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#657583">不盲删外部</text>
<text x="1100.0" y="535.5" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="middle" fill="#657583">先确认原生结果</text>
<polyline points="260,570 260,680" fill="none" stroke="#28705f" stroke-width="2"/>
<polyline points="254.99755037084947,669.0924110039014 260,680 265.00244962915053,669.0924110039014" fill="none" stroke="#28705f" stroke-width="2"/>
<rect x="80" y="680" width="360" height="115" fill="#edf7f2" stroke="#28705f" stroke-width="2"/>
<text x="260.0" y="731.2" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" fill="#28705f">外部成功 / 不存在：成功</text>
<text x="260.0" y="758.5" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" fill="#28705f">外部失败：删除部分失败</text>
<rect x="500" y="680" width="780" height="115" fill="#f5f7f9" stroke="#657583" stroke-width="2" stroke-dasharray="9 7"/>
<text x="525" y="727.0" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" fill="#243746">Master 未记录对象，不代表外部没有对象。</text>
<text x="525" y="756.9" font-family="Microsoft YaHei, sans-serif" font-size="23" text-anchor="start" fill="#243746">删除重试不得误删后来重建的对象。</text>
<text x="65" y="877.0" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" fill="#243746">原生淘汰不透传删除；外部未确认删除时，不报告完整删除成功。</text>
</svg>