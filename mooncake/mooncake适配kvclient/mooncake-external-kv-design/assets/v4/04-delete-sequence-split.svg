<text x="442" y="1032.0" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="start" fill="#657583">else  提交失败，且没有在途任务</text>
<text x="1170.0" y="1066.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#ad3434">6b. 提交错误</text>
<polyline points="1370,1080 970,1080" fill="none" stroke="#ad3434" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="980.9075889960986,1074.9975503708495 970,1080 980.9075889960986,1085.0024496291505" fill="none" stroke="#ad3434" stroke-width="2"/>
<text x="770.0" y="1131.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#ad3434">8b. 提交错误（无句柄）</text>
<polyline points="970,1145 570,1145" fill="none" stroke="#ad3434" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="580.9075889960986,1139.9975503708495 570,1145 580.9075889960986,1150.0024496291505" fill="none" stroke="#ad3434" stroke-width="2"/>
<text x="1200.0" y="1231.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#93651f">9. 原生 Remove(key, force) / BatchRemove</text>
<polyline points="570,1245 1830,1245" fill="none" stroke="#93651f" stroke-width="2"/>
<polyline points="1819.0924110039014,1250.0024496291505 1830,1245 1819.0924110039014,1239.9975503708495" fill="none" stroke="#93651f" stroke-width="2"/>
<polyline points="430,1280 1990,1280 1990,1705 430,1705 430,1280" fill="none" stroke="#657583" stroke-width="2" stroke-dasharray="9 7"/>
<text x="442" y="1308.0" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="start" fill="#657583">alt  force=false 且存在未过期读租约</text>
<text x="1200.0" y="1351.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#ad3434">10a. OBJECT_HAS_LEASE：原生拒绝，外部仍已提交</text>
<polyline points="1830,1365 570,1365" fill="none" stroke="#ad3434" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="580.9075889960986,1359.9975503708495 570,1365 580.9075889960986,1370.0024496291505" fill="none" stroke="#ad3434" stroke-width="2"/>
<polyline points="430,1400 1990,1400" fill="none" stroke="#657583" stroke-width="2" stroke-dasharray="9 7"/>
<text x="442" y="1427.0" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="start" fill="#657583">else  force=false 且无有效租约</text>
<text x="1200.0" y="1476.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#93651f">10b. 正常删除结果 / 明确 NotFound / 其他错误</text>
<polyline points="1830,1490 570,1490" fill="none" stroke="#93651f" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="580.9075889960986,1484.9975503708495 570,1490 580.9075889960986,1495.0024496291505" fill="none" stroke="#93651f" stroke-width="2"/>
<polyline points="430,1530 1990,1530" fill="none" stroke="#657583" stroke-width="2" stroke-dasharray="9 7"/>
<text x="442" y="1557.0" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="start" fill="#657583">else  force=true：跳过租约检查</text>
<text x="1200.0" y="1616.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#93651f">10c. 正常删除结果 / 明确 NotFound / 其他错误</text>
<polyline points="1830,1630 570,1630" fill="none" stroke="#93651f" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="580.9075889960986,1624.9975503708495 570,1630 580.9075889960986,1635.0024496291505" fill="none" stroke="#93651f" stroke-width="2"/>
<polyline points="430,1750 1580,1750 1580,2240 430,2240 430,1750" fill="none" stroke="#657583" stroke-width="2" stroke-dasharray="9 7"/>
<text x="442" y="1778.0" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="start" fill="#657583">opt  已获得 OperationHandle：原生拒绝 / 失败也必须执行 Wait</text>
<text x="770.0" y="1816.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#28705f">11. OperationHandle::Wait()</text>
<polyline points="570,1830 970,1830" fill="none" stroke="#28705f" stroke-width="2"/>
<polyline points="959.0924110039014,1835.0024496291505 970,1830 959.0924110039014,1824.9975503708495" fill="none" stroke="#28705f" stroke-width="2"/>
<text x="1170.0" y="1886.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#28705f">12. Wait(TaskId, timeout)</text>
<polyline points="970,1900 1370,1900" fill="none" stroke="#28705f" stroke-width="2"/>
<polyline points="1359.0924110039014,1905.0024496291505 1370,1900 1359.0924110039014,1894.9975503708495" fill="none" stroke="#28705f" stroke-width="2"/>
<text x="1170.0" y="1956.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#28705f">13. 任务结果 / 超时</text>
<polyline points="1370,1970 970,1970" fill="none" stroke="#28705f" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="980.9075889960986,1964.9975503708495 970,1970 980.9075889960986,1975.0024496291505" fill="none" stroke="#28705f" stroke-width="2"/>
