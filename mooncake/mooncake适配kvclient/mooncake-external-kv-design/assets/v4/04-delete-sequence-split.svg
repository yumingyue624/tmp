<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="2840" viewBox="0 0 2040 2840">
<rect width="100%" height="100%" fill="white"/>
<text x="50" y="56.0" font-family="Microsoft YaHei, sans-serif" font-size="30" text-anchor="start" fill="#243746">删除时序：外部均执行，原生按 force 检查租约</text>
<text x="50" y="100.0" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="start" fill="#657583">实线：调用；虚线：返回；红色：错误路径。原生缓存淘汰不触发此流程。</text>
