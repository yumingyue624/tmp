<text x="802" y="2028.0" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="start" fill="#657583">opt  外部执行失败或超时</text>
<polyline points="970,2050 1035,2050 1035,2082 970,2082" fill="none" stroke="#ad3434" stroke-width="2"/>
<polyline points="980.9075889960986,2076.9975503708492 970,2082 980.9075889960986,2087.0024496291503" fill="none" stroke="#ad3434" stroke-width="2"/>
<text x="1050" y="2068.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#ad3434">14. 保留逐项错误 / 未确认状态</text>
<text x="1050" y="2091.4" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#ad3434">不将外部失败报告为删除成功</text>
<text x="770.0" y="2196.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#28705f">15. 外部逐项结果</text>
<polyline points="970,2210 570,2210" fill="none" stroke="#28705f" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="580.9075889960986,2204.9975503708492 570,2210 580.9075889960986,2215.0024496291503" fill="none" stroke="#28705f" stroke-width="2"/>
<polyline points="570,2300 635,2300 635,2332 570,2332" fill="none" stroke="#315b8a" stroke-width="2"/>
<polyline points="580.9075889960986,2326.9975503708492 570,2332 580.9075889960986,2337.0024496291503" fill="none" stroke="#315b8a" stroke-width="2"/>
<text x="650" y="2318.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#315b8a">16. 汇合两侧结果（见下表）</text>
<text x="370.0" y="2396.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#315b8a">17. 返回汇合结果</text>
<polyline points="570,2410 170,2410" fill="none" stroke="#315b8a" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="180.9075889960986,2404.9975503708492 170,2410 180.9075889960986,2415.0024496291503" fill="none" stroke="#315b8a" stroke-width="2"/>
<rect x="70" y="2470" width="1880" height="175" fill="#edf3fa" stroke="#315b8a" stroke-width="2"/>
<text x="1010.0" y="2522.3" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#315b8a">两侧已删 / 明确不存在 → 幂等成功</text>
<text x="1010.0" y="2550.9" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#315b8a">原生租约拒绝 → 返回原生错误；外部已删则记录部分删除</text>
<text x="1010.0" y="2579.5" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#315b8a">原生已删但外部失败 / 未确认 → 删除失败 / 部分失败</text>
<text x="1010.0" y="2608.1000000000004" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#315b8a">原生结果不确定 → 保留逐侧状态，不报告完整成功</text>
<text x="1010.0" y="2711.0" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" fill="#657583">KVClient 无 force 参数；force 仅作用于原生租约检查。超时任务须安全收敛，未知结果不盲重试。</text>
