<text x="650" y="323.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#315b8a">2. 校验 key，保留 force 与原始下标</text>
<text x="650" y="346.4" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#315b8a">等待同 key 前序写完成</text>
<text x="770.0" y="461.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#28705f">3. Remove / BatchRemove</text>
