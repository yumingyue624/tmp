<text x="1050" y="878.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#28705f">7. 以 TaskId 构造 OperationHandle</text>
<text x="1050" y="901.4" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#28705f">保存 SDK 上下文与批量下标</text>
<text x="770.0" y="961.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#28705f">8a. OperationHandle</text>
<polyline points="970,975 570,975" fill="none" stroke="#28705f" stroke-width="2" stroke-dasharray="9 7"/>
