<text x="442" y="783.0" font-family="Microsoft YaHei, sans-serif" font-size="19" text-anchor="start" fill="#657583">alt  SDK 接受请求：force=true / false 均提交外部删除</text>
<text x="1170.0" y="826.0" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle" fill="#28705f">6a. TaskId</text>
<polyline points="1370,840 970,840" fill="none" stroke="#28705f" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="980.9075889960986,834.9975503708495 970,840 980.9075889960986,845.0024496291505" fill="none" stroke="#28705f" stroke-width="2"/>
