<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1780" viewBox="0 0 1440 1780"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs><rect width="1440" height="1780" fill="white"/><text x="35" y="50.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="30" fill="#1e293b" text-anchor="start">Namespace 切批：调用链与结果回填</text><text x="35" y="88.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="start">示例：GLM 5.2 · SGLang direct linker；每个 block 的 KV / index 分属两个 namespace</text><text x="35" y="123.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#64748b" text-anchor="start">灰色：现有流程    橙色：新增 / 调整    协议条目上限以 2 为例</text><text x="30" y="199.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">Mooncake 调用</text><rect x="230" y="160" width="900" height="92" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/><text x="680.0" y="192.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">一个 ClientTask，6 个输入条目</text><text x="680.0" y="219.6" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">0:Block 0/KV   1:Block 0/index   2:Block 1/KV</text><text x="680.0" y="247.2" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">3:Block 1/index   4:Block 2/KV   5:Block 2/index</text><polyline points="680,262 680,287" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="339.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">KeyResolver</text><rect x="230" y="300" width="900" height="100" fill="#fff0d9" stroke="#9a4b00" stroke-width="1.7"/><text x="680.0" y="333.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#9a4b00" text-anchor="middle">提取 pool / PP → 实际 namespace → GNSID</text><text x="680.0" y="361.98" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#9a4b00" text-anchor="middle">移除对应字段后编码 key → CacheKey {8 字节 key, GNSID}</text><text x="680.0" y="390.96" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#9a4b00" text-anchor="middle">同一 block 的 KV / index：key 相同，namespace 不同</text><polyline points="680,410 680,435" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="487.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">Client / DHT</text><rect x="230" y="448" width="900" height="75" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/><text x="680.0" y="481.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#1e293b" text-anchor="middle">仅按编码 key 路由，按 ASU 创建 TransportTask</text><text x="680.0" y="509.98" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#1e293b" text-anchor="middle">记录 originalIndices：ASU 内条目 → 原始输入位置</text><polyline points="680,533 680,562" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="215" y="575" width="930" height="915" fill="#ffffff" stroke="#475569" stroke-width="1.7" stroke-dasharray="7 5"/><text x="677.5" y="614.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#1e293b" text-anchor="middle">TransportTask 1 → ASU 1（展开）</text><text x="677.5" y="652.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">本地下标： 0:Block 0/KV   1:Block 0/index   2:Block 2/KV   3:Block 2/index</text><text x="677.5" y="688.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#64748b" text-anchor="middle">originalIndices = [0, 1, 4, 5]</text><polyline points="1140,485 1270,485 1270,570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="1175" y="585" width="235" height="75" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/><text x="1292.5" y="616.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1e293b" text-anchor="middle">TransportTask 2</text><text x="1292.5" y="642.22" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1e293b" text-anchor="middle">→ ASU 2</text><text x="1292.5" y="731.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="30" fill="#1e293b" text-anchor="middle">⋮</text><rect x="1175" y="760" width="235" height="75" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/><text x="1292.5" y="791.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1e293b" text-anchor="middle">TransportTask N</text><text x="1292.5" y="817.22" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#1e293b" text-anchor="middle">→ ASU N</text><text x="1293.0" y="863.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#64748b" text-anchor="middle">各任务处理相同</text><text x="1293.0" y="887.84" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#64748b" text-anchor="middle">其余分支省略</text><text x="30" y="759.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">IoScheduler</text><rect x="245" y="720" width="870" height="138" fill="#fff0d9" stroke="#9a4b00" stroke-width="1.7"/><text x="680.0" y="752.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#9a4b00" text-anchor="middle">按 GNSID 聚合为连续请求条目 vector</text><text x="680.0" y="779.6" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#9a4b00" text-anchor="middle">KV 组：   [Block 0, Block 2]   indices=[0, 2]</text><text x="680.0" y="807.2" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#9a4b00" text-anchor="middle">index 组：[Block 0, Block 2]   indices=[1, 3]</text><text x="680.0" y="834.8" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#9a4b00" text-anchor="middle">保存各组 GNSID 与 indices</text><polyline points="680,868 680,894" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="946.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">协议 namespace</text><rect x="245" y="907" width="870" height="85" fill="#fff0d9" stroke="#9a4b00" stroke-width="1.7"/><text x="680.0" y="938.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#9a4b00" text-anchor="middle">M900：每组查询一次 (ASU, GNSID) → LocalNSID</text><text x="680.0" y="964.22" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#9a4b00" text-anchor="middle">M800：直接使用 GNSID</text><text x="680.0" y="990.44" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#9a4b00" text-anchor="middle">保存该组协议 namespace，后续各子批次复用</text><polyline points="680,1002 680,1017" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="1069.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">现有切批</text><rect x="245" y="1030" width="870" height="65" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/><text x="680.0" y="1062.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">每组 vector → BatchView → SplitBatchView</text><text x="680.0" y="1089.6" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">按协议数量上限切分为子批次</text><polyline points="680,1105 680,1122" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="1174.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">现有组包</text><rect x="245" y="1135" width="870" height="65" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/><text x="680.0" y="1167.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">各子批次复用该组协议 namespace → 组包发送</text><text x="680.0" y="1194.6" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">复用现有协议组包函数</text><polyline points="680,1210 680,1248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="1300.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">ASU 执行</text><rect x="245" y="1261" width="870" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/><text x="680.0" y="1293.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">KV 请求 / index 请求独立发送与完成</text><text x="680.0" y="1320.6" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">每个请求只包含一个 namespace</text><polyline points="680,1341 680,1369" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="1421.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">本地回填</text><rect x="245" y="1382" width="870" height="91" fill="#fff0d9" stroke="#9a4b00" stroke-width="1.7"/><text x="680.0" y="1413.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#9a4b00" text-anchor="middle">按 indices 回填 TransportTask 结果</text><text x="680.0" y="1439.22" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#9a4b00" text-anchor="middle">KV 结果 → 本地位置 [0,2]；index 结果 → [1,3]</text><text x="680.0" y="1465.44" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#9a4b00" text-anchor="middle">恢复顺序：[Block 0/KV, Block 0/index, Block 2/KV, Block 2/index]</text><polyline points="680,1500 680,1532" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><polyline points="1270,925 1270,1577 1140,1577" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="1584.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#475569" text-anchor="start">Client 汇总</text><rect x="230" y="1545" width="900" height="95" fill="#f1f5f9" stroke="#475569" stroke-width="1.7"/><text x="680.0" y="1577.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">各 ASU 的结果按 originalIndices 回填</text><text x="680.0" y="1604.6" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">恢复到原始 6 项输入顺序；失败 / 超时也回到对应位置</text><text x="680.0" y="1632.2" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">全部任务完成后返回，沿用现有回调与资源回收机制</text><text x="230" y="1693.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" fill="#9a4b00" text-anchor="start">两级回填：批次 indices → ASU 内位置；originalIndices → 原始调用位置。</text><text x="230" y="1733.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#64748b" text-anchor="start">聚合仅复制请求条目，不复制 HBM 数据；子批次保留对应的 indices 区间。</text></svg>